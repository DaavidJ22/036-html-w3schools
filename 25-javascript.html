<!DOCTYPE html>
<html>
<body>

    <h1>HTML JavaScript</h1>

    <p id="demo">Este texto cambiará al presionar el botón.</p>

    <button
        type="button"
        onclick="document.getElementById('demo').innerHTML = '¡Hola JavaScript!'">
        Cambiar texto
    </button>

    <button
        type="button"
        onclick="document.getElementById('demo').style.color = 'red'">
        Cambiar color
    </button>

    <script>
        document.getElementById("demo").style.fontSize = "20px";
    </script>

    <noscript>
        Tu navegador no admite JavaScript.
    </noscript>

</body>
</html>
