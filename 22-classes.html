<!DOCTYPE html>
<html>
<head>
    <title>HTML Classes</title>

    <style>
        .ciudad {
            background-color: tomato;
            color: white;
            border: 2px solid black;
            margin: 20px;
            padding: 20px;
        }

        .importante {
            font-size: 120%;
            color: red;
        }
    </style>
</head>

<body>

    <h1>Clases en HTML</h1>

    <div class="ciudad">
        <h2>Guatemala</h2>
        <p>Guatemala es la capital del país.</p>
    </div>

    <div class="ciudad">
        <h2>Antigua Guatemala</h2>
        <p>Antigua Guatemala es una ciudad colonial.</p>
    </div>

    <p>
        Este es un texto
        <span class="importante">importante</span>.
    </p>

</body>
</html>
