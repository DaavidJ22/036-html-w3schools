<!DOCTYPE html>
<html>
<body>

    <h1>Elementos de bloque y en línea</h1>

    <div style="background-color:lightblue;">
        Este es un elemento de bloque.
    </div>

    <p>
        Este párrafo también es un elemento de bloque.
    </p>

    <p>
        Este texto contiene un
        <span style="color:red;">elemento en línea</span>
        dentro del párrafo.
    </p>

    <p>
        Un enlace como
        <a href="https://www.w3schools.com">W3Schools</a>
        también es un elemento en línea.
    </p>

</body>
</html>
