<!DOCTYPE html>
<html>
<head>
    <title>HTML Div</title>

    <style>
        .contenedor {
            background-color: lightblue;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>Elemento div</h1>

    <p>El siguiente contenido está agrupado dentro de un div:</p>

    <div class="contenedor">
        <h2>Guatemala</h2>
        <p>Guatemala es un país de Centroamérica.</p>
        <p>Su ciudad capital es la Ciudad de Guatemala.</p>
    </div>

</body>
</html>
