<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HTML Symbols</title>
</head>

<body>

    <h1>Símbolos HTML</h1>

    <p>Símbolo del euro usando nombre: &euro;</p>

    <p>Símbolo del euro usando número decimal: &#8364;</p>

    <p>Símbolo del euro usando número hexadecimal: &#x20AC;</p>

    <p>Marca registrada: &reg;</p>

    <p>Marca comercial: &trade;</p>

    <p>Flecha izquierda: &larr;</p>

    <p>Flecha derecha: &rarr;</p>

    <p>Corazón: &hearts;</p>

    <p>Suma matemática: &sum;</p>

    <p>Letra griega delta: &Delta;</p>

</body>
</html>
