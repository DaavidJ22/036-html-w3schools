<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HTML Input Types</title>
</head>

<body>

    <h1>Tipos de entrada en HTML</h1>

    <form>

        <label for="nombre">Texto:</label><br>
        <input type="text" id="nombre" name="nombre"><br><br>

        <label for="contrasena">Contraseña:</label><br>
        <input type="password" id="contrasena" name="contrasena"><br><br>

        <label for="correo">Correo electrónico:</label><br>
        <input type="email" id="correo" name="correo"><br><br>

        <label for="numero">Número:</label><br>
        <input type="number" id="numero" name="numero" min="1" max="10"><br><br>

        <label for="fecha">Fecha:</label><br>
        <input type="date" id="fecha" name="fecha"><br><br>

        <label for="hora">Hora:</label><br>
        <input type="time" id="hora" name="hora"><br><br>

        <label for="color">Color:</label><br>
        <input type="color" id="color" name="color"><br><br>

        <label for="rango">Rango:</label><br>
        <input type="range" id="rango" name="rango" min="0" max="100"><br><br>

        <label for="archivo">Archivo:</label><br>
        <input type="file" id="archivo" name="archivo"><br><br>

        <p>Selecciona una opción:</p>

        <input type="radio" id="html" name="lenguaje" value="HTML">
        <label for="html">HTML</label><br>

        <input type="radio" id="css" name="lenguaje" value="CSS">
        <label for="css">CSS</label><br><br>

        <input type="checkbox" id="aceptar" name="aceptar">
        <label for="aceptar">Aceptar condiciones</label><br><br>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpiar">

    </form>

</body>
</html>
