<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HTML Forms</title>
</head>

<body>

    <h1>Formularios HTML</h1>

    <form action="/action_page.php">

        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" name="nombre"><br><br>

        <label for="apellido">Apellido:</label><br>
        <input type="text" id="apellido" name="apellido"><br><br>

        <p>Selecciona tu lenguaje favorito:</p>

        <input type="radio" id="html" name="lenguaje" value="HTML">
        <label for="html">HTML</label><br>

        <input type="radio" id="css" name="lenguaje" value="CSS">
        <label for="css">CSS</label><br>

        <input type="radio" id="javascript" name="lenguaje" value="JavaScript">
        <label for="javascript">JavaScript</label><br><br>

        <p>Selecciona los dispositivos que tienes:</p>

        <input type="checkbox" id="computadora" name="computadora" value="Computadora">
        <label for="computadora">Tengo una computadora</label><br>

        <input type="checkbox" id="telefono" name="telefono" value="Telefono">
        <label for="telefono">Tengo un teléfono</label><br><br>

        <input type="submit" value="Enviar">

    </form>

</body>
</html>
