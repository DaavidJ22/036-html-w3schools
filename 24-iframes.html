<!DOCTYPE html>
<html>
<body>

    <h1>HTML Iframes</h1>

    <p>
        Un iframe permite mostrar una página web dentro de otra página.
    </p>

    <iframe
        src="https://www.w3schools.com"
        width="600"
        height="300"
        title="Página de W3Schools"
        style="border:2px solid black;">
    </iframe>

    <p>
        <a href="https://www.wikipedia.org" target="pagina">
            Mostrar Wikipedia en el iframe
        </a>
    </p>

    <iframe
        src="https://www.w3schools.com"
        name="pagina"
        width="600"
        height="300"
        title="Página mostrada mediante un enlace"
        style="border:none;">
    </iframe>

</body>
</html>
