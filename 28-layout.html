<!DOCTYPE html>
<html lang="es">
<head>
    <title>HTML Layout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        header {
            background-color: gray;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            float: left;
            width: 30%;
            height: 250px;
            background-color: lightgray;
            padding: 20px;
        }

        nav ul {
            list-style-type: none;
            padding: 0;
        }

        article {
            float: left;
            width: 70%;
            height: 250px;
            padding: 20px;
            background-color: whitesmoke;
        }

        section::after {
            content: "";
            display: table;
            clear: both;
        }

        footer {
            background-color: gray;
            color: white;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

    <header>
        <h1>Ciudades de Guatemala</h1>
    </header>

    <section>

        <nav>
            <ul>
                <li><a href="#">Guatemala</a></li>
                <li><a href="#">Antigua Guatemala</a></li>
                <li><a href="#">Quetzaltenango</a></li>
            </ul>
        </nav>

        <article>
            <h2>Ciudad de Guatemala</h2>

            <p>
                La Ciudad de Guatemala es la capital del país.
            </p>

            <p>
                Es el principal centro urbano, económico y cultural
                de Guatemala.
            </p>
        </article>

    </section>

    <footer>
        <p>Ejemplo de distribución de una página web</p>
    </footer>

</body>
</html>
