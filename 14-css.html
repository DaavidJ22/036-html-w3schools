<!DOCTYPE html>
<html>
<head>
    <title>HTML CSS</title>

    <style>
        body {
            background-color: powderblue;
        }

        h1 {
            color: blue;
            font-family: verdana;
            font-size: 300%;
        }

        p {
            color: red;
            font-family: courier;
            font-size: 160%;
            border: 2px solid blue;
            padding: 20px;
            margin: 30px;
        }
    </style>
</head>

<body>

    <h1>Este es un encabezado con CSS interno</h1>

    <p>Este párrafo utiliza color, fuente, tamaño, borde, padding y margin.</p>

    <h2 style="color:green;">
        Este encabezado utiliza CSS en línea
    </h2>

</body>
</html>
