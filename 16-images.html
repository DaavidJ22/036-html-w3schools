<!DOCTYPE html>
<html>
<body>

    <h1>Imágenes HTML</h1>

    <img
        src="https://www.w3schools.com/images/w3schools_green.jpg"
        alt="Logo de W3Schools"
        width="200"
        height="200">

    <p>Imagen con tamaño definido mediante CSS:</p>

    <img
        src="https://www.w3schools.com/images/img_girl.jpg"
        alt="Mujer con una chaqueta"
        style="width:250px;height:300px;">

    <p>Imagen flotando a la derecha:</p>

    <img
        src="https://www.w3schools.com/images/w3schools_green.jpg"
        alt="Logo de W3Schools"
        style="float:right;width:100px;height:100px;">

    <p>
        Este texto aparece junto a la imagen porque se utilizó
        la propiedad float.
    </p>

</body>
</html>
