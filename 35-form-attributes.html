<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HTML Form Attributes</title>
</head>

<body>

    <h1>Atributos de formularios HTML</h1>

    <form
        action="/action_page.php"
        method="get"
        target="_blank"
        autocomplete="on">

        <label for="nombre">Nombre:</label><br>

        <input
            type="text"
            id="nombre"
            name="nombre"><br><br>

        <label for="apellido">Apellido:</label><br>

        <input
            type="text"
            id="apellido"
            name="apellido"><br><br>

        <input type="submit" value="Enviar">

    </form>

</body>
</html>
